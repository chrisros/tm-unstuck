name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TM-Unstuck
          path: build/TM Unstuck.app
