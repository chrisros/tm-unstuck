name: Release

# Push a tag like v1.0.0 to build the app and attach a zip to a new GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent "build/TM Unstuck.app" TM-Unstuck.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TM-Unstuck.zip --title "TM Unstuck $GITHUB_REF_NAME" --generate-notes
